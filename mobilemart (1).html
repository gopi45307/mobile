function orders(){if(!S.user){authM();return $('#app').innerHTML='<div class="box">Please log in to see your orders.</div>'}const L=S.orders.filter(o=>o.uid==S.user.e||S.user.role=='admin');$('#app').innerHTML=`<h2>My orders</h2>${L.map(o=>`<div class="box"><div class="row"><b class="f">${o.id}</b><span class="tag">${ST[o.st]}</span></div><div>${o.items.map(i=>gp(i.id)?.n+' × '+i.q).join(', ')}</div><div class="mu">${o.date} · ${inr(o.total)}</div><div class="tl">${ST.map((s,i)=>`<div class="${i<=o.st?'d':''}">${s}</div>`).join('')}</div></div>`).join('')||'<div class="box">No orders yet.</div>'}`}
function profile(){const u=S.user;if(!u){$('#app').innerHTML='<div class="box" style="margin-top:20px;text-align:center"><h3>Welcome to MobileMart</h3><button class="p" onclick="authM()">Login / Sign up</button></div>';return}
const M=[['📦 My Orders',"location.hash='#/orders'"],['♥ Wishlist',"location.hash='#/wish'"],['📍 Saved Addresses',"info('Saved Addresses',CO.a.ad?CO.a.ad+', '+CO.a.ci+' '+CO.a.pc:'No saved address yet. Add one at checkout.')"],['💳 Payment Methods',"info('Payment Methods','UPI, cards and net banking are saved securely at checkout.')"],['🔔 Notifications',"notif()"],['⚙ Settings',"tgTheme()"],['❓ Help & Support',"info('Help & Support','Call +91 98765 43210 or email support@mobilemart.in')"]];
$('#app').innerHTML=`<div class="box row" style="margin-top:14px"><div class="hero" style="margin:0;min-height:0;width:64px;height:64px;padding:0;border-radius:50%;justify-content:center;font-size:26px;font-weight:700">${u.n[0]}</div><div><b>${u.n}</b><div class="mu">${u.e}<br>+91 ${u.ph}</div><span class="tag">${u.role}</span></div></div>${u.role=='admin'?'<button class="p" style="width:100%;margin-bottom:8px" onclick="location.hash=\'#/admin\'">Open admin dashboard</button>':''}${M.map(m=>`<button style="width:100%;text-align:left;margin-bottom:6px;background:var(--card);border:1px solid var(--bd)" onclick="${m[1]}">${m[0]}</button>`).join('')}<button style="width:100%;color:var(--red)" onclick="S.user=null;save();toast('Logged out');location.hash='#/'">Logout</button>`}
function authM(m){m=m||'login';const f={login:`<input id="ae" placeholder="Email" value="demo@mobilemart.in"><input id="ap" type="password" placeholder="Password" value="demo123" style="margin:8px 0"><button class="p" onclick="login()">Login</button> <a class="mu" onclick="authM('forgot')">Forgot password?</a><p class="mu">New here? <a style="color:var(--pri)" onclick="authM('signup')">Create account</a><br>Admin: admin@mobilemart.in / admin123</p>`,signup:`<input id="an" placeholder="Full name"><input id="ae" placeholder="Email" style="margin:8px 0"><input id="ah" placeholder="Phone" style="margin-bottom:8px"><input id="ap" type="password" placeholder="Password (min 6)"><button class="p" style="margin-top:8px" onclick="signup()">Sign up</button> <a class="mu" onclick="authM()">Back to login</a>`,forgot:`<input id="ae" placeholder="Registered email"><button class="p" style="margin-top:8px" onclick="if(S.users.find(u=>u.e==$('#ae').value)){authM('reset')}else toast('Email not found')">Send reset link</button>`,reset:`<p class="mu">Reset link verified (demo).</p><input id="ap" type="password" placeholder="New password"><button class="p" style="margin-top:8px" onclick="let u=S.users.find(u=>u.e==$('#ae')?.value);toast('Password updated');authM()">Reset password</button>`};modal(`<h3>${{login:'Login',signup:'Create account',forgot:'Forgot password',reset:'Reset password'}[m]}</h3>${f[m]}`)}
function login(){const u=S.users.find(u=>u.e==$('#ae').value.trim()&&u.p==$('#ap').value);if(!u)return toast('Wrong email or password');S.user=u;save();closeM();toast('Welcome back, '+u.n.split(' ')[0]);route()}
function signup(){const n=$('#an').value.trim(),e=$('#ae').value.trim(),p=$('#ap').value;if(!n||!/\S+@\S+/.test(e)||p.length<6)return toast('Enter name, valid email and 6+ char password');if(S.users.find(u=>u.e==e))return toast('Email already registered');const u={n,e,p,role:'customer',ph:$('#ah').value};S.users.push(u);S.user=u;save();closeM();toast('Account created');route()}
function offers(){$('#app').innerHTML=`<h2>Offers</h2>${S.offers.filter(o=>o.on).map(o=>`<div class="box row"><span style="font-size:28px">🎁</span><b class="f">${o.t}</b><a class="btn p" href="#/shop">Shop</a></div>`).join('')}<div class="offer"><h3>Sale ends in</h3><div class="cd" id="cd"></div></div>`;tick()}
function faq(){$('#app').innerHTML=`<h2>FAQ</h2>`+[['How do I track my order?','Open Profile → My Orders to see the live timeline.'],['Is EMI available?','Yes, no-cost EMI up to 9 months on select cards.'],['What is the return window?','7 days for manufacturing defects.'],['Can I exchange my old phone?','Yes — use Exchange Now on the home page.']].map(f=>`<details><summary>${f[0]}</summary><p class="mu">${f[1]}</p></details>`).join('')+`<h2>EMI calculator</h2><div class="box"><input id="ea" type="number" value="50000"><input id="em" type="number" value="12" style="margin:8px 0"><button class="p" onclick="let a=+$('#ea').value,m=+$('#em').value,r=.13/12,e=a*r*Math.pow(1+r,m)/(Math.pow(1+r,m)-1);info('Your EMI',inr(e)+' / month at 13% p.a.')">Calculate</button></div>`}
function admin(){if(!S.user||S.user.role!='admin'){$('#app').innerHTML='<div class="box" style="margin-top:20px"><h3>Admins only</h3><p class="mu">Log in with an admin account to continue.</p><button class="p" onclick="authM()">Login</button></div>';return}
const rev=S.orders.reduce((a,o)=>a+o.total,0),mx=[3,4,6,5,7,9,8,10,9,12,11,14],ms='JFMAMJJASOND'.slice(0,0)+'Oct Nov Dec Jan Feb Mar Apr May Jun Jul Aug Sep'.split(' '),pop=[...P].sort((a,b)=>b.rv-a.rv).slice(0,5);
$('#app').innerHTML=`<h2>Admin dashboard</h2><div class="stats"><div class="box"><span class="mu">Total products</span><b>${P.length}</b></div><div class="box"><span class="mu">Total orders</span><b>${S.orders.length}</b></div><div class="box"><span class="mu">Customers</span><b>${S.users.filter(u=>u.role=='customer').length}</b></div><div class="box"><span class="mu">Revenue</span><b>${inr(rev)}</b></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:12px"><div class="box"><b>Monthly revenue (₹ lakh)</b><div class="bar" style="margin-bottom:22px;margin-top:10px">${mx.map((v,i)=>`<i style="height:${v*7}px" data-l="${ms[i]}"></i>`).join('')}</div></div><div class="box"><b>Popular products</b>${pop.map(p=>`<div class="row"><span class="f">${p.n}</span><span class="mu">${p.rv}</span></div>`).join('')}</div><div class="box"><b>Orders by status</b>${ST.map((s,i)=>`<div class="row"><span class="f">${s}</span><b>${S.orders.filter(o=>o.st==i).length}</b></div>`).join('')}</div></div>
<h2>Products <button class="p" onclick="pform()">Add Product</button></h2><div class="tw box"><table class="sp"><tr><th>Name</th><th>Price</th><th>Stock</th><th></th></tr>${P.map(p=>`<tr><td>${p.b} ${p.n}</td><td>${inr(pr(p))}</td><td>${p.stock}</td><td><button onclick="pform(${p.id})">Edit</button> <button style="color:var(--red)" onclick="if(confirm('Delete ${p.n}?')){P=P.filter(x=>x.id!=${p.id});save();admin()}">Delete</button></td></tr>`).join('')}</table></div>
<h2>Orders</h2><div class="tw box"><table class="sp">${S.orders.map((o,i)=>`<tr><td>${o.id}<br><span class="mu">${o.name}</span></td><td>${inr(o.total)}</td><td><select onchange="S.orders[${i}].st=+this.value;save();toast('Status updated')">${ST.map((s,j)=>`<option value="${j}" ${j==o.st?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
<h2>Customers</h2><div class="box">${S.users.map(u=>`<div class="row"><span class="f">${u.n}</span><span class="mu">${u.e}</span></div>`).join('')}</div>
<h2>Offers</h2><div class="box">${S.offers.map((o,i)=>`<label class="row"><span class="f">${o.t}</span><input type="checkbox" style="width:auto" ${o.on?'checked':''} onchange="S.offers[${i}].on=this.checked;save()"></label>`).join('')}</div>`}
function pform(id){const p=id?gp(id):{b:'Apple',n:'',mrp:20000,d:10,ram:8,st:128,cpu:'',disp:'',cam:'',bat:'',stock:10};const f=(k,l,t)=>`<label class="mu">${l}<input id="f_${k}" ${t||''} value="${p[k]}"></label>`;
modal(`<h3>${id?'Edit':'Add'} product</h3><label class="mu">Brand<select id="f_b">${Object.keys(B).map(b=>`<option ${b==p.b?'selected':''}>${b}</option>`).join('')}</select></label>${f('n','Product name')}${f('mrp','Price (₹)','type=number')}${f('d','Discount %','type=number')}${f('ram','RAM (GB)','type=number')}${f('st','Storage (GB)','type=number')}${f('cpu','Processor')}${f('disp','Display')}${f('cam','Camera')}${f('bat','Battery')}${f('stock','Stock','type=number')}<div class="act" style="opacity:1;transform:none"><button class="p" onclick="psave(${id||0})">${id?'Update Product':'Add Product'}</button>${id?`<button style="color:var(--red)" onclick="P=P.filter(x=>x.id!=${id});save();closeM();admin()">Delete Product</button>`:''}</div>`)}
function psave(id){const g=k=>$('#f_'+k).value,n=k=>+g(k);if(!g('n').trim())return toast('Enter a product name');const d={b:g('b'),n:g('n'),mrp:n('mrp'),d:n('d'),ram:n('ram'),st:n('st'),cpu:g('cpu')||'—',disp:g('disp')||'—',cam:g('cam')||'—',bat:g('bat')||'—',stock:n('stock')};if(id)Object.assign(gp(id),d);else P.push({...d,id:Math.max(0,...P.map(p=>p.id))+1,r:4,rv:0,chg:'—',os:'Android',cols:['#0f172a','#94a3b8'],tag:'new'});save();closeM();toast(id?'Product updated':'Product added');admin()}
function nav(){const h=location.hash,a=x=>h==x||(x=='#/'&&(h==''||h=='#/'))?'on':'';$('#nav').innerHTML=`<a class="${a('#/')}" href="#/"><b>🏠</b>Home</a><a class="${h.startsWith('#/shop')?'on':''}" href="#/shop" onclick="F={b:[],price:'',ram:[],st:[],r:0,q:''}"><b>▦</b>Categories</a><a onclick="$('#q').focus();scrollTo(0,0)"><b>🔍</b>Search</a><a class="${a('#/cart')}" href="#/cart"><b>🛒</b>Cart</a><a class="${h.startsWith('#/prof')?'on':''}" href="#/profile"><b>👤</b>Profile</a>`}
function route(){clearInterval(ht);const [p,qs]=(location.hash||'#/').slice(1).split('?'),app=$('#app');app.classList.remove('pg');app.offsetWidth;app.classList.add('pg');closeM();const np=$('.np');np&&np.remove();
const R={'/':home,'/shop':()=>shop(qs),'/cart':cart,'/checkout':checkout,'/wish':wl,'/orders':orders,'/profile':profile,'/compare':compare,'/offers':offers,'/faq':faq,'/admin':admin};
if(p.startsWith('/p/'))prod(+p.slice(3));else(R[p]||home)();if(p!='/checkout'&&CO.step==3)CO.step=0;nav();cbar();scrollTo(0,0)}
addEventListener('hashchange',route);badge();route();
</script></body></html>
